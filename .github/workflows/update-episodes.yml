name: Update episodes

on:
  schedule:
    - cron: "15 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build episodes.json
        run: python scripts/update_episodes.py

      - name: Commit if changed
        id: commit
        run: |
          if git ls-files --error-unmatch episodes.json >/dev/null 2>&1 && git diff --quiet -- episodes.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add episodes.json
            git commit -m "Update episodes.json"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/episodes.json" || true
